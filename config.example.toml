# Copy this file to ~/.meeting-notes/config.toml and edit it there.
# Do not commit the copy. Webhook credentials can also be set with
# MEETING_NOTES_WEBHOOK_URL, MEETING_NOTES_WEBHOOK_AUTH_HEADER, and
# MEETING_NOTES_WEBHOOK_AUTH_VALUE (those override this file).

# Where a finished watcher session is POSTed. Empty disables delivery.
webhook_url = "https://example.invalid/meeting-notes"

# Sent only when both the name and the value are non-empty.
# The value is the full header, so a bearer token is "Bearer <key>".
webhook_auth_header = "Authorization"
webhook_auth_value = "replace-me"

# Max JSON body per POST, in bytes. Long transcripts are split into several
# requests that stay under this size (a single ~8 KB body was being cut off
# mid-sentence). 0 sends one request with the whole transcript.
# Reassemble by sorting on chunk_index. Each body repeats the meeting fields
# and sets transcript to that piece only. transcript_sha256 and
# transcript_chars describe the full text. Retries can repeat a chunk;
# replace on (folder_name, chunk_index) instead of appending twice.
webhook_max_body_bytes = 6000

# How long the call signal must hold before a recording starts, and how long
# it must be gone before it stops. The Meet tab and the microphone have to
# be seen together once; after that, either one keeps the join and the
# recording alive. See the README.
join_debounce_seconds = 12
leave_debounce_seconds = 25
poll_interval_seconds = 2
outbox_retry_seconds = 60

# transcript_only applies to manual `start` and `reprocess`.
# Leave it false so `meeting-notes start "Name"` still writes Claude notes.
transcript_only = false

# Watcher-started sessions. Independent of the manual default above.
watcher_transcript_only = true

# Delete audio.wav after a successful webhook delivery. Manual sessions
# still delete audio after notes.md is written, unless --keep-audio is set.
delete_audio_after_delivery = false

# Optional. Empty uses the built-in "Meet - <code or title>" Chrome title.
# A pattern with a capture group uses that group as the display name.
window_title_regex = ""

# Substring matched against the process using the microphone: the consent-store
# subkey and, when pycaw is installed, the WASAPI capture-session process name.
# Chrome is unpackaged, so the default looks for chrome.exe.
mic_process_marker = "chrome.exe"

# Whisper settings for sessions started by the watcher.
whisper_model = "medium"
language = "en"
