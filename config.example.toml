# Copy this file to ~/.meeting-notes/config.toml and edit it there.
# Do not commit the copy. Webhook credentials can also be set with
# MEETING_NOTES_WEBHOOK_URL, MEETING_NOTES_WEBHOOK_AUTH_HEADER, and
# MEETING_NOTES_WEBHOOK_AUTH_VALUE (those override this file).

# Where a finished watcher session is POSTed. Empty disables delivery.
webhook_url = "https://example.invalid/meeting-notes"

# Sent only when both the name and the value are non-empty.
# The value is the full header, so a bearer token is "Bearer <key>".
webhook_auth_header = "Authorization"
webhook_auth_value = "replace-me"

# Max JSON body per POST, in bytes. Long transcripts are split into several
# requests that stay under this size (a single ~8 KB body was being cut off
# mid-sentence). 0 sends one request with the whole transcript.
# Reassemble by sorting on chunk_index. Each body repeats the meeting fields
# and sets transcript to that piece only. transcript_sha256 and
# transcript_chars describe the full text. Retries can repeat a chunk;
# replace on (folder_name, chunk_index) instead of appending twice.
webhook_max_body_bytes = 6000

# How long the call signal must hold before a recording starts, and how long
# it must be gone before it stops. The Meet tab and the microphone have to
# be seen together once; after that, either one keeps the join and the
# recording alive. See the README.
join_debounce_seconds = 12
leave_debounce_seconds = 25
poll_interval_seconds = 2
outbox_retry_seconds = 60

# transcript_only applies to manual `start` and `reprocess`.
# Leave it false so `meeting-notes start "Name"` still writes Claude notes.
transcript_only = false

# Watcher-started sessions. Independent of the manual default above.
# false transcribes, summarizes, and delivers. true skips Claude notes.
watcher_transcript_only = false

# Keep audio.wav, audio-self.wav, and audio-others.wav after transcript.txt
# is written. The default removes them once the transcript exists.
# --keep-audio does the same for a single command.
keep_audio = false

# Delete audio.wav after a successful webhook delivery, if it is still there.
delete_audio_after_delivery = false

# Optional. Empty uses the built-in "Meet - <code or title>" Chrome title.
# A pattern with a capture group uses that group as the display name.
window_title_regex = ""

# Substring matched against the process using the microphone: the consent-store
# subkey and, when pycaw is installed, the WASAPI capture-session process name.
# Chrome is unpackaged, so the default looks for chrome.exe. This applies to
# Google Meet. A Slack Huddle is slack.exe holding the microphone, not this
# marker, and not a window title.
mic_process_marker = "chrome.exe"

# Watcher sources. Omit either line to leave it on. A manual
# `meeting-notes start` never uses these and does not deliver to the webhook.
watch_google_meet = true
watch_slack_huddle = true

# Whisper settings for sessions started by the watcher.
whisper_model = "medium"
language = "en"
# auto (CUDA if usable, else CPU int8), cpu, cuda, or mps (experimental
# Metal backend on Apple Silicon; falls back to CPU on error).
whisper_device = "auto"
# Spelling hint passed to Whisper. Empty turns it off.
# whisper_vocabulary = "Greek, Bebop, Base Batches, Uniswap, ..."
# Run one Whisper transcription at a time; later sessions wait their turn.
serial_transcription = true

# Name the microphone track with this label. The default "You" is replaced
# by your Google Meet display name when the Chrome extension reports it.
# Set a real name here to always use that, even if Meet shows something else.
self_name = "You"

# false keeps the historical "[MM:SS] text" lines and does not write
# audio-self.wav, audio-others.wav, or transcript.json.
speaker_labels = true

# Loopback port the optional Meet extension posts speaker samples to.
# `meeting-notes speakers` copies that port into the extension folder.
speaker_bridge_port = 8765

# Split the remote (system-audio) track into voices on this machine and put
# names on them (calendar attendees, Meet/Slack window title, people
# introducing themselves or being addressed by name, saved voice profiles).
# Uses sherpa-onnx + two public ONNX models that scripts/install_macos.sh
# downloads into ~/.meeting-notes/models. No account or token.
diarize = true

# auto: sherpa-onnx when installed, then pyannote if hf_token or HF_TOKEN is
# set and pyannote is installed, otherwise speechbrain, resemblyzer, or a
# built-in numpy clusterer. Also: sherpa, builtin, speechbrain, resemblyzer,
# pyannote, off.
diarize_backend = "auto"

# Hint for pyannote. Voices that still sound different are not merged to fit.
diarize_max_speakers = 8

# Only the optional pyannote model needs this. Leave it empty and set
# HF_TOKEN (or HUGGING_FACE_HUB_TOKEN) in the environment instead if you can.
# Accept the model terms at huggingface.co/pyannote/speaker-diarization-3.1
# before the first run. Never commit a real token.
hf_token = ""

# Off by default. When true, and webhook_url is set, the watcher POSTs one
# small JSON object if it starts after being down for more than 15 minutes
# on the same local day. The body is {"type": "watcher-health", "down_seconds": ...}
# and is not a transcript. Receivers can ignore that type. It is not written
# to the transcript outbox, and a gap that crosses local midnight (the computer
# was off overnight) does not send one.
watcher_health_ping = false

# --- Speaker naming --------------------------------------------------------
# Lists are comma-separated strings.
# Other names you go by; never given to a remote voice.
self_aliases = ""
# People you talk to often (first names are fine). Lets "thanks, Mahmoud"
# name a voice even without a calendar entry.
known_people = ""
# Who can be in a Slack channel huddle (channel: names; channel: names).
slack_channel_rosters = ""
# Company / product names that are never read as a person in a title.
organizations = "Greek, greek.fi, Bebop, Base, Coinbase"
# Calendar attendees. A JSON events file (for example one synced into Google
# Drive) and/or the calendar's private iCal URL. The URL is a secret: keep it
# out of git and logs.
calendar_json_path = ""
calendar_ics_url = ""
# Remember the voices of confirmed people in ~/.meeting-notes/voices.
voice_profiles = true

# --- Delivery and retention -------------------------------------------------
# Also write the complete transcript (txt, json and a .sha256) here, for
# example a Google Drive synced folder. Empty turns it off.
transcript_archive_dir = ""
# Watcher sessions keep their audio until the transcript passed verification
# and was delivered or archived.
delete_audio_requires_delivery = true
