[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-notes"
version = "0.1.0"
description = "Privacy-first local meeting notes generator"
requires-python = ">=3.9"
dependencies = [
    "faster-whisper",
]

[project.optional-dependencies]
windows = [
    "PyAudioWPatch",
    "numpy",
    "keyboard",
]
# NVIDIA CUDA runtime libs for GPU transcription. Optional: the transcriber
# auto-detects a usable GPU and falls back to CPU (int8) when these are absent.
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[project.scripts]
meeting-notes = "meeting_notes.cli:main"
